name: Music-Bot 7-24

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  musicbot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: FFmpeg kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Bagimliliklari kur
        working-directory: ./MusicBot-main
        run: npm install

      - name: Opus native kur
        working-directory: ./MusicBot-main
        run: |
          npm install @discordjs/opus --save
          node -e "console.log(require('@discordjs/opus').OpusEncoder ? 'Opus OK' : 'Opus FAIL')"

      - name: yt-dlp binary kur
        working-directory: ./MusicBot-main
        run: |
          mkdir -p node_modules/youtube-dl-exec/bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
               -o node_modules/youtube-dl-exec/bin/yt-dlp
          chmod +x node_modules/youtube-dl-exec/bin/yt-dlp

      - name: .env olustur
        working-directory: ./MusicBot-main
        run: |
          cat > .env << 'EOF'
          DISCORD_TOKEN=${{ secrets.MUSICBOT_TOKEN }}
          CLIENT_ID=1274117617983946846
          GUILD_ID=1552401095249100870
          SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
          BOT_STATUS=🎵 Müzik Dinliyor | /play
          DEFAULT_VOLUME=80
          MAX_QUEUE_SIZE=200
          MAX_PLAYLIST_SIZE=100
          EMBED_COLOR=#FF6B6B
          COLOR_YOUTUBE=#FF0000
          COLOR_SPOTIFY=#1DB954
          COLOR_SOUNDCLOUD=#FF5500
          COLOR_SUCCESS=#57F287
          COLOR_ERROR=#ED4245
          COLOR_WARNING=#FEE75C
          COLOR_INFO=#5865F2
          COLOR_QUEUE=#EB459E
          TOTAL_SHARDS=auto
          SHARD_RESPAWN=true
          EOF

      - name: Botu calistir
        working-directory: ./MusicBot-main
        run: node index.js
