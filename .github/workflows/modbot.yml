name: Mod-Bot 7-24
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  modbot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # ✅ DATA CACHE GERİ YÜKLE
      - name: Data cache geri yukle
        uses: actions/cache@v4
        with:
          path: modbot/data
          key: modbot-data-${{ github.run_id }}
          restore-keys: |
            modbot-data-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bagimliliklari kur
        working-directory: ./modbot
        run: npm install

      - name: Ses AFK paketlerini kur
        working-directory: ./modbot
        run: |
          npm install @discordjs/voice sodium-native opusscript --save
          node -e "console.log('@discordjs/voice:', require('@discordjs/voice') ? 'OK' : 'FAIL')"
          node -e "console.log('sodium-native:', require('sodium-native') ? 'OK' : 'FAIL')"
          node -e "console.log('opusscript:', require('opusscript') ? 'OK' : 'FAIL')"

      - name: .env olustur
        working-directory: ./modbot
        run: |
          cat > .env <<'EOF'
          BOT_TOKEN=${{ secrets.MODBOT_TOKEN }}
          PREFIX=!
          OWNER_ID=1160564359727173792
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODERATION_ENABLED=true
          OPENAI_THRESHOLD=0.75
          EOF

      - name: Botu calistir
        working-directory: ./modbot
        run: node index.js
