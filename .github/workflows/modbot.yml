name: Mod-Bot 7-24
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  modbot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # ═══════════════════════════════════════════════════════════
      #  1. CACHE (artık gerek yok ama dursun, zarar vermez)
      # ═══════════════════════════════════════════════════════════
      - name: Data cache geri yukle
        uses: actions/cache@v4
        with:
          path: modbot/data
          key: modbot-data-${{ github.run_id }}
          restore-keys: |
            modbot-data-

      # ═══════════════════════════════════════════════════════════
      #  2. NODE KURULUMU
      # ═══════════════════════════════════════════════════════════
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ═══════════════════════════════════════════════════════════
      #  3. ANA BAĞIMLILIKLAR
      # ═══════════════════════════════════════════════════════════
      - name: Bagimliliklari kur
        working-directory: ./modbot
        run: npm install

      # ═══════════════════════════════════════════════════════════
      #  4. SES AFK PAKETLERİ (voice + encryption + opus)
      # ═══════════════════════════════════════════════════════════
      - name: Ses AFK paketlerini kur
        working-directory: ./modbot
        run: |
          npm install @discordjs/voice sodium-native opusscript --save
          node -e "console.log('@discordjs/voice:', require('@discordjs/voice') ? 'OK' : 'FAIL')"
          node -e "console.log('sodium-native:', require('sodium-native') ? 'OK' : 'FAIL')"
          node -e "console.log('opusscript:', require('opusscript') ? 'OK' : 'FAIL')"

      # ═══════════════════════════════════════════════════════════
      #  5. FIREBASE PAKETİ (YENİ!)
      # ═══════════════════════════════════════════════════════════
      - name: Firebase paketini kur
        working-directory: ./modbot
        run: |
          npm install firebase-admin --save
          node -e "console.log('firebase-admin:', require('firebase-admin') ? 'OK' : 'FAIL')"

      # ═══════════════════════════════════════════════════════════
      #  6. .env DOSYASI (Firebase satırı eklendi!)
      # ═══════════════════════════════════════════════════════════
      - name: .env olustur
        working-directory: ./modbot
        run: |
          cat > .env <<'EOF'
          BOT_TOKEN=${{ secrets.MODBOT_TOKEN }}
          PREFIX=!
          OWNER_ID=1160564359727173792
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODERATION_ENABLED=true
          OPENAI_THRESHOLD=0.75
          FIREBASE_SERVICE_ACCOUNT=${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EOF
          echo ".env dosyasi olusturuldu:"
          grep -o '^[A-Z_]*=' .env | tr -d '='

      # ═══════════════════════════════════════════════════════════
      #  7. BOTU ÇALIŞTIR
      # ═══════════════════════════════════════════════════════════
      - name: Botu calistir
        working-directory: ./modbot
        run: node index.js
