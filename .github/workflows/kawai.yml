name: Kawai Bot 7-24

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

# ═══════════════════════════════════════════════════════════════
#  AYNI ANDA SADECE 1 RUN — Yenisi başlayınca eskisini iptal eder
# ═══════════════════════════════════════════════════════════════
concurrency:
  group: kawai-run
  cancel-in-progress: true

jobs:
  kawai:
    runs-on: ubuntu-latest
    timeout-minutes: 280

    steps:
      - uses: actions/checkout@v4

      # ═══════════════════════════════════════════════════════════
      #  1. NODE KURULUMU
      # ═══════════════════════════════════════════════════════════
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ═══════════════════════════════════════════════════════════
      #  2. SİSTEM FONTLARI (Canvas Görsel İşleme İçin Gerekli)
      # ═══════════════════════════════════════════════════════════
      - name: Sistem Fontlarini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core libfontconfig1

      # ═══════════════════════════════════════════════════════════
      #  3. BAĞIMLILIKLAR
      # ═══════════════════════════════════════════════════════════
      - name: Bagimliliklari kur
        working-directory: ./kawai
        run: |
          npm install
          node -e "console.log('discord.js:', require('discord.js') ? 'OK' : 'FAIL')"
          node -e "console.log('@napi-rs/canvas:', require('@napi-rs/canvas') ? 'OK' : 'FAIL')"
          node -e "console.log('firebase-admin:', require('firebase-admin') ? 'OK' : 'FAIL')"
          node -e "console.log('openai:', require('openai') ? 'OK' : 'FAIL')"
          node -e "console.log('dotenv:', require('dotenv') ? 'OK' : 'FAIL')"

      # ═══════════════════════════════════════════════════════════
      #  4. .env DOSYASI (Boşluk hatalarını önlemek için echo kullanıldı)
      # ═══════════════════════════════════════════════════════════
      - name: .env olustur
        working-directory: ./kawai
        run: |
          echo "DISCORD_TOKEN=${{ secrets.KAWAI_TOKEN }}" > .env
          echo "CLIENT_ID=${{ secrets.KAWAI_CLIENT_ID }}" >> .env
          echo "KAWAI_CF_ACCOUNT_ID=${{ secrets.KAWAI_CF_ACCOUNT_ID }}" >> .env
          echo "KAWAI_CF_API_TOKEN=${{ secrets.KAWAI_CF_API_TOKEN }}" >> .env
          echo "KAWAI_OPENAI_API_KEY=${{ secrets.KAWAI_OPENAI_API_KEY }}" >> .env
          echo "FIREBASE_SERVICE_ACCOUNT_B64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}" >> .env
          echo "KAWAI_OWNER_IDS=${{ secrets.KAWAI_OWNER_IDS }}" >> .env
          echo ".env dosyasi olusturuldu:"
          grep -o '^[A-Z_]*=' .env | tr -d '='

      # ═══════════════════════════════════════════════════════════
      #  5. BOTU ÇALIŞTIR
      # ═══════════════════════════════════════════════════════════
      - name: Botu calistir
        working-directory: ./kawai
        env:
          DISCORD_TOKEN: ${{ secrets.KAWAI_TOKEN }}
          CLIENT_ID: ${{ secrets.KAWAI_CLIENT_ID }}
          KAWAI_CF_ACCOUNT_ID: ${{ secrets.KAWAI_CF_ACCOUNT_ID }}
          KAWAI_CF_API_TOKEN: ${{ secrets.KAWAI_CF_API_TOKEN }}
          KAWAI_OPENAI_API_KEY: ${{ secrets.KAWAI_OPENAI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          KAWAI_OWNER_IDS: ${{ secrets.KAWAI_OWNER_IDS }}
        run: node index.js
