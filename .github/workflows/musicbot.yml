name: Music-Bot 7-24

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: music-bot-runtime
  cancel-in-progress: true

jobs:
  musicbot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: "🔍 Sistem bilgisi"
        run: |
          echo "════════════════════════════════════════════════════"
          echo "  SİSTEM DEBUG"
          echo "════════════════════════════════════════════════════"
          echo "Node:    $(node -v)"
          echo "NPM:     $(npm -v)"
          echo "OS:      $(uname -a)"
          echo "CPU:     $(nproc) çekirdek"
          echo "RAM:     $(free -h | grep Mem)"
          echo "Disk:    $(df -h / | tail -1)"
          echo "IP:      $(curl -s ifconfig.me || echo 'bilinmiyor')"
          echo "════════════════════════════════════════════════════"

      - name: FFmpeg kur
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: "🔍 FFmpeg versiyon"
        run: |
          echo "FFmpeg: $(ffmpeg -version | head -1)"
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -i opus || echo "  ⚠️ opus encoder YOK"
          ffmpeg -hide_banner -decoders 2>/dev/null | grep -i opus || echo "  ⚠️ opus decoder YOK"

      - name: Bağımlılıkları kur
        working-directory: ./MusicBot-main
        run: npm install --no-audit --no-fund

      - name: "🎵 Discord.js + Voice 0.18.0 (DAVE fix)"
        working-directory: ./MusicBot-main
        run: |
          npm uninstall @discordjs/voice 2>/dev/null || true
          npm install discord.js@14.16.3 @discordjs/voice@0.18.0 --save --no-audit --no-fund

      - name: "🔐 DAVE şifreleme modülü"
        working-directory: ./MusicBot-main
        run: |
          npm install @snazzah/davey@latest --save --no-audit --no-fund
          node -e "try { require('@snazzah/davey'); console.log('✅ DAVE modülü yüklendi'); } catch(e) { console.log('❌ DAVE YOK:', e.message); process.exit(1); }"

      - name: "🎵 Opus kur"
        working-directory: ./MusicBot-main
        run: |
          npm uninstall @discordjs/opus opusscript 2>/dev/null || true
          if npm install @discordjs/opus --save --no-audit --no-fund 2>/dev/null; then
            node -e "require('@discordjs/opus'); console.log('✅ @discordjs/opus (native)');" || true
          else
            npm install opusscript --save --no-audit --no-fund
          fi

      - name: yt-dlp binary kur
        working-directory: ./MusicBot-main
        run: |
          mkdir -p node_modules/youtube-dl-exec/bin
          curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
               -o node_modules/youtube-dl-exec/bin/yt-dlp
          chmod +x node_modules/youtube-dl-exec/bin/yt-dlp
          echo "yt-dlp: $(./node_modules/youtube-dl-exec/bin/yt-dlp --version)"

      - name: "🔍 UDP çıkış testi"
        run: |
          if timeout 5 bash -c 'echo test > /dev/udp/8.8.8.8/53' 2>/dev/null; then
            echo "✅ UDP çıkışı ÇALIŞIYOR"
          else
            echo "❌ UDP çıkışı BLOKLU"
          fi

      - name: Cookies dosyasını oluştur
        working-directory: ./MusicBot-main
        run: printf '%s\n' "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: "🧹 Bozuk satırları temizle"
        working-directory: ./MusicBot-main
        run: |
          node <<'NODEEOF'
          const fs = require("fs");
          const p = "src/MusicPlayer.js";
          let c = fs.readFileSync(p, "utf8");

          // connect() fonksiyonundaki bozuk _stateLoggerAttached bloğunu düzelt
          c = c.replace(
            /async connect\(\)\s*\{[\s\S]*?if\s*\(this\.connection[\s\S]*?_stateLoggerAttached[\s\S]*?\}\s*\ntry\s*\{/,
            'async connect() {\n        try {'
          );

          // Gereksiz satırları temizle
          const lines = c.split("\n");
          const cleaned = lines.filter(l =>
            !l.includes("console.log([Voice]") &&
            !l.includes("_stateLoggerAttached")
          );
          fs.writeFileSync(p, cleaned.join("\n"));
          console.log("CLEAN OK");
          NODEEOF
          node --check src/MusicPlayer.js && echo "✅ MusicPlayer.js sözdizimi geçerli" || exit 1

      - name: "🔧 Voice patch (DAVE off + timeout 30s)"
        working-directory: ./MusicBot-main
        run: |
          node <<'NODEEOF'
          const fs = require("fs");
          const p = "src/MusicPlayer.js";
          let c = fs.readFileSync(p, "utf8");
          if (!c.includes("daveEncryption")) {
            const i = c.indexOf("joinVoiceChannel(");
            if (i >= 0) {
              const j = c.indexOf("{", i);
              if (j >= 0) c = c.slice(0,j+1) + "\n            daveEncryption: false," + c.slice(j+1);
            }
          }
          if (c.includes("15_000")) c = c.split("15_000").join("30_000");
          fs.writeFileSync(p, c);
          console.log("Patch OK");
          NODEEOF
          node --check src/MusicPlayer.js && echo "✅ Patch sonrası sözdizimi geçerli" || exit 1

      # ══════════════════════════════════════════════════════════════════════
      #  .env — RRT bot + 3 ajan botun tüm bilgileri secrets'tan geliyor
      # ══════════════════════════════════════════════════════════════════════
      - name: ".env oluştur (RRT + ajanlar)"
        working-directory: ./MusicBot-main/rrt-bot
        env:
          # RRT yönlendirici bot
          MUSICBOT_TOKEN:        ${{ secrets.MUSICBOT_TOKEN }}
          MUSICBOT_CLIENT_ID:    ${{ secrets.MUSICBOT_CLIENT_ID }}
          GUILD_ID:              ${{ secrets.KAWAI_GUILD_ID }}
          # RRT-1
          AGENT1_TOKEN:          ${{ secrets.AGENT1_TOKEN }}
          AGENT1_CLIENT_ID:      ${{ secrets.AGENT1_CLIENT_ID }}
          AGENT1_SECRET:         ${{ secrets.AGENT1_SECRET }}
          # RRT-2
          AGENT2_TOKEN:          ${{ secrets.AGENT2_TOKEN }}
          AGENT2_CLIENT_ID:      ${{ secrets.AGENT2_CLIENT_ID }}
          AGENT2_SECRET:         ${{ secrets.AGENT2_SECRET }}
          # RRT-3
          AGENT3_TOKEN:          ${{ secrets.AGENT3_TOKEN }}
          AGENT3_CLIENT_ID:      ${{ secrets.AGENT3_CLIENT_ID }}
          AGENT3_SECRET:         ${{ secrets.AGENT3_SECRET }}
          # Spotify
          SPOTIFY_CLIENT_ID:     ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          cat > .env <<EOF
          DISCORD_TOKEN=${MUSICBOT_TOKEN}
          CLIENT_ID=${MUSICBOT_CLIENT_ID}
          GUILD_ID=${GUILD_ID}

          AGENT1_TOKEN=${AGENT1_TOKEN}
          AGENT1_CLIENT_ID=${AGENT1_CLIENT_ID}
          AGENT1_PORT=3101
          AGENT1_SECRET=${AGENT1_SECRET}

          AGENT2_TOKEN=${AGENT2_TOKEN}
          AGENT2_CLIENT_ID=${AGENT2_CLIENT_ID}
          AGENT2_PORT=3102
          AGENT2_SECRET=${AGENT2_SECRET}

          AGENT3_TOKEN=${AGENT3_TOKEN}
          AGENT3_CLIENT_ID=${AGENT3_CLIENT_ID}
          AGENT3_PORT=3103
          AGENT3_SECRET=${AGENT3_SECRET}

          SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
          SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}

          DEFAULT_VOLUME=80
          MAX_QUEUE_SIZE=200
          MAX_PLAYLIST_SIZE=100
          AUDIO_BITRATE=128
          COOKIES_FILE=../cookies.txt
          EMBED_COLOR=#5865F2
          COLOR_SUCCESS=#57F287
          COLOR_ERROR=#ED4245
          COLOR_QUEUE=#EB459E
          EOF
          echo "✅ .env oluşturuldu"

      - name: "🚀 Pool başlat (RRT + RRT-1 + RRT-2 + RRT-3)"
        working-directory: ./MusicBot-main
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: |
          node pool-start.js &
          POOL_PID=$!
          echo "Pool PID: $POOL_PID — $(date -u)"
          while true; do
            if ! kill -0 $POOL_PID 2>/dev/null; then
              echo "$(date -u): Pool durdu, yeniden başlatılıyor..."
              node pool-start.js &
              POOL_PID=$!
            fi
            sleep 30
          done
