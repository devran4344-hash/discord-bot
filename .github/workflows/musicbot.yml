name: Music-Bot 7-24
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  musicbot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bagimliliklari kur
        working-directory: ./MusicBot-main
        run: npm install
      - name: yt-dlp binary kur
        working-directory: ./MusicBot-main
        run: |
          mkdir -p node_modules/youtube-dl-exec/bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o node_modules/youtube-dl-exec/bin/yt-dlp
          chmod +x node_modules/youtube-dl-exec/bin/yt-dlp
          node_modules/youtube-dl-exec/bin/yt-dlp --version
      - name: PO Token Provider kur
        run: |
          python3 -m pip install --upgrade pip
          pip install bgutil-ytdlp-pot-provider
          echo "Kuruldu"
      - name: PO Token Provider baslat
        run: |
          nohup python3 -m bgutil_ytdlp_pot_provider.server --port 4416 > pot.log 2>&1 &
          sleep 10
          echo "=== PO Token log ==="
          cat pot.log
          echo "=== Port kontrol ==="
          curl -s http://127.0.0.1:4416/ping || echo "Port yanit vermedi"
      - name: yt-dlp config olustur
        working-directory: ./MusicBot-main
        run: |
          cat > yt-dlp.conf <<'EOF'
          --extractor-args "youtube:player_client=web_safari,web"
          --no-check-certificates
          --no-warnings
          --retries 3
          --fragment-retries 3
          EOF
          echo "=== yt-dlp.conf ==="
          cat yt-dlp.conf
      - name: .env olustur
        working-directory: ./MusicBot-main
        run: |
          cat > .env <<'EOF'
          DISCORD_TOKEN=${{ secrets.MUSICBOT_TOKEN }}
          CLIENT_ID=1274117617983946846
          GUILD_ID=1552401095249100870
          EMBED_COLOR=#FF6B6B
          STATUS=Muzik Dinliyor
          COOKIES_FILE=./cookies.txt
          YOUTUBE_PO_TOKEN=http://127.0.0.1:4416
          TOTAL_SHARDS=auto
          SHARD_LIST=auto
          SHARD_MODE=process
          SHARD_RESPAWN=true
          SHARD_SPAWN_DELAY=5500
          SHARD_SPAWN_TIMEOUT=30000
          EOF
      - name: cookies.txt olustur
        working-directory: ./MusicBot-main
        run: |
          printf '%s\n' "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
          echo "=== Ilk 3 satir ==="
          head -3 cookies.txt
          echo "=== Toplam satir ==="
          wc -l cookies.txt
      - name: Botu calistir
        working-directory: ./MusicBot-main
        run: node index.js
