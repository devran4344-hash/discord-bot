name: Music-Bot 7-24
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  musicbot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bagimliliklari kur
        working-directory: ./MusicBot-main
        run: npm install
      - name: .env olustur
        working-directory: ./MusicBot-main
        run: |
          cat > .env <<'EOF'
          DISCORD_TOKEN=${{ secrets.MUSICBOT_TOKEN }}
          CLIENT_ID=1274117617983946846
          GUILD_ID=1552401095249100870
          EMBED_COLOR=#FF6B6B
          STATUS=Muzik Dinliyor
          COOKIES_FILE=./cookies.txt
          TOTAL_SHARDS=auto
          SHARD_LIST=auto
          SHARD_MODE=process
          SHARD_RESPAWN=true
          SHARD_SPAWN_DELAY=5500
          SHARD_SPAWN_TIMEOUT=30000
          EOF
      - name: cookies.txt olustur
        working-directory: ./MusicBot-main
        run: |
          cat > cookies.txt <<'COOKIEEOF'
          ${{ secrets.YOUTUBE_COOKIES }}
          COOKIEEOF
      - name: Botu calistir
        working-directory: ./MusicBot-main
        run: node index.js
