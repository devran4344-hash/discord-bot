name: Music-Bot 7-24
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  musicbot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        working-directory: ./MusicBot-main
        run: npm install

      - name: yt-dlp binary ve PO Token eklentisini kur
        working-directory: ./MusicBot-main
        run: |
          # yt-dlp binary'sini indir
          mkdir -p node_modules/youtube-dl-exec/bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o node_modules/youtube-dl-exec/bin/yt-dlp
          chmod +x node_modules/youtube-dl-exec/bin/yt-dlp
          
          # PO Token eklentisini kur
          pip install --upgrade pip
          pip install bgutil-ytdlp-pot-provider
          echo "yt-dlp ve PO Token eklentisi kuruldu."

      - name: PO Token Provider Server'ı Başlat (Docker)
        run: |
          docker run -d --name bgutil-provider -p 127.0.0.1:4416:4416 --init brainicism/bgutil-ytdlp-pot-provider:latest
          echo "Container başlatıldı, sunucunun hazır olması bekleniyor..."
          sleep 15
          echo "=== Container Durumu ==="
          docker ps -a
          echo "=== Sunucu Logları ==="
          docker logs bgutil-provider
          echo "=== Port Kontrolü ==="
          curl -s http://127.0.0.1:4416/ping || echo "Sunucu yanıt vermedi!"

      - name: .env dosyasını oluştur
        working-directory: ./MusicBot-main
        run: |
          cat > .env <<'EOF'
          DISCORD_TOKEN=${{ secrets.MUSICBOT_TOKEN }}
          CLIENT_ID=1274117617983946846
          GUILD_ID=1552401095249100870
          EMBED_COLOR=#FF6B6B
          STATUS=Muzik Dinliyor
          COOKIES_FILE=./cookies.txt
          YOUTUBE_PO_TOKEN=http://127.0.0.1:4416
          TOTAL_SHARDS=auto
          SHARD_LIST=auto
          SHARD_MODE=process
          SHARD_RESPAWN=true
          SHARD_SPAWN_DELAY=5500
          SHARD_SPAWN_TIMEOUT=30000
          EOF

      - name: cookies.txt dosyasını oluştur
        working-directory: ./MusicBot-main
        run: |
          printf '%s\n' "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
          echo "=== İlk 3 Satır ==="
          head -3 cookies.txt
          echo "=== Toplam Satır ==="
          wc -l cookies.txt

      - name: Botu çalıştır
        working-directory: ./MusicBot-main
        run: node index.js
