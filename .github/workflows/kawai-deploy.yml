name: Kawai Komut Deploy

on:
  workflow_dispatch:

concurrency:
  group: kawai-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # ═══════════════════════════════════════════════════════════
      #  1. NODE KURULUMU
      # ═══════════════════════════════════════════════════════════
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ═══════════════════════════════════════════════════════════
      #  2. BAĞIMLILIKLAR
      # ═══════════════════════════════════════════════════════════
      - name: Bagimliliklari kur
        working-directory: ./kawai
        run: npm install

      # ═══════════════════════════════════════════════════════════
      #  3. .env DOSYASI
      # ═══════════════════════════════════════════════════════════
      - name: .env olustur
        working-directory: ./kawai
        run: |
          cat > .env <<'EOF'
          DISCORD_TOKEN=${{ secrets.KAWAI_TOKEN }}
          CLIENT_ID=${{ secrets.KAWAI_CLIENT_ID }}
          KAWAI_NVIDIA_API_KEY=${{ secrets.KAWAI_NVIDIA_API_KEY }}
          KAWAI_OPENAI_API_KEY=${{ secrets.KAWAI_OPENAI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_B64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          KAWAI_OWNER_IDS=${{ secrets.KAWAI_OWNER_IDS }}
          EOF
          echo ".env olusturuldu."
          grep -o '^[A-Z_]*=' .env | tr -d '='

      # ═══════════════════════════════════════════════════════════
      #  4. SLASH KOMUTLARINI KAYDET
      # ═══════════════════════════════════════════════════════════
      - name: Slash komutlari kaydet
        working-directory: ./kawai
        run: node deploy-commands.js
