name: Kawai Komut Deploy

on:
  workflow_dispatch:

concurrency:
  group: kawai-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bagimliliklari kur
        working-directory: ./kawai
        run: npm install

      - name: .env olustur
        working-directory: ./kawai
        run: |
          cat > .env <<'EOF'
          DISCORD_TOKEN=${{ secrets.KAWAI_TOKEN }}
          CLIENT_ID=${{ secrets.KAWAI_CLIENT_ID }}
          KAWAI_CF_ACCOUNT_ID=${{ secrets.KAWAI_CF_ACCOUNT_ID }}
          KAWAI_CF_API_TOKEN=${{ secrets.KAWAI_CF_API_TOKEN }}
          KAWAI_OPENAI_API_KEY=${{ secrets.KAWAI_OPENAI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_B64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          KAWAI_OWNER_IDS=${{ secrets.KAWAI_OWNER_IDS }}
          EOF
          echo ".env olusturuldu."

      - name: Slash komutlari kaydet
        working-directory: ./kawai
        run: node deploy-commands.js
