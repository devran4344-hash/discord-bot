name: Sevgili Botu 7-24

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: sevgili-run
  cancel-in-progress: true

jobs:
  sevgili:
    runs-on: ubuntu-latest
    timeout-minutes: 280

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bagimliliklari kur
        working-directory: ./sevgili-botu
        run: |
          npm install
          node -e "console.log('discord.js:', require('discord.js') ? 'OK' : 'FAIL')"
          node -e "console.log('firebase-admin:', require('firebase-admin') ? 'OK' : 'FAIL')"
          node -e "console.log('dotenv:', require('dotenv') ? 'OK' : 'FAIL')"

      - name: .env olustur
        working-directory: ./sevgili-botu
        run: |
          cat > .env <<'EOF'
          DISCORD_TOKEN=${{ secrets.SEVGILI_TOKEN }}
          CLIENT_ID=${{ secrets.SEVGILI_CLIENT_ID }}
          KAWAI_CF_ACCOUNT_ID=${{ secrets.KAWAI_CF_ACCOUNT_ID }}
          KAWAI_CF_API_TOKEN=${{ secrets.KAWAI_CF_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_B64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          SEVGILI_OWNER_IDS=${{ secrets.SEVGILI_OWNER_IDS }}
          EOF
          echo ".env dosyasi olusturuldu:"
          grep -o '^[A-Z_]*=' .env | tr -d '='

      - name: Botu calistir
        working-directory: ./sevgili-botu
        env:
          DISCORD_TOKEN: ${{ secrets.SEVGILI_TOKEN }}
          CLIENT_ID: ${{ secrets.SEVGILI_CLIENT_ID }}
          KAWAI_CF_ACCOUNT_ID: ${{ secrets.KAWAI_CF_ACCOUNT_ID }}
          KAWAI_CF_API_TOKEN: ${{ secrets.KAWAI_CF_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          SEVGILI_OWNER_IDS: ${{ secrets.SEVGILI_OWNER_IDS }}
        run: node index.js
