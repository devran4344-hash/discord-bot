name: OwO Bot
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./owo-botu
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Start Bot
        env:
          OWO_TOKEN: ${{ secrets.OWO_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: node index.js
