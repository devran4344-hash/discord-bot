name: Discord Bots 7-24
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════
  #  MOD-BOT
  # ═══════════════════════════════════════
  modbot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bagimliliklari kur
        working-directory: ./modbot
        run: npm install
      - name: .env olustur
        working-directory: ./modbot
        run: |
          cat > .env <<'EOF'
          BOT_TOKEN=${{ secrets.MODBOT_TOKEN }}
          PREFIX=!
          OWNER_ID=1160564359727173792
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODERATION_ENABLED=true
          OPENAI_THRESHOLD=0.75
          EOF
      - name: Botu calistir
        working-directory: ./modbot
        run: node index.js

  # ═══════════════════════════════════════
  #  NSFW-BOT (KrX)
  # ═══════════════════════════════════════
  nsfwbot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bagimliliklari kur
        working-directory: ./KrX
        run: npm install
      - name: config.json olustur
        working-directory: ./KrX
        run: |
          cat > config.json <<EOF
          {
            "token": "${{ secrets.NSFWBOT_TOKEN }}",
            "clientId": "1244369544500215859",
            "sightengine_user": "${{ secrets.SIGHTENGINE_USER }}",
            "sightengine_secret": "${{ secrets.SIGHTENGINE_SECRET }}"
          }
          EOF
      - name: Botu calistir
        working-directory: ./KrX
        run: node index.js

  # ═══════════════════════════════════════
  #  MUSIC-BOT
  # ═══════════════════════════════════════
  musicbot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bagimliliklari kur
        working-directory: ./MusicBot-main
        run: npm install
      - name: .env olustur
        working-directory: ./MusicBot-main
        run: |
          cat > .env <<'EOF'
          DISCORD_TOKEN=${{ secrets.MUSICBOT_TOKEN }}
          CLIENT_ID=1274117617983946846
          GUILD_ID=1552401095249100870
          EMBED_COLOR=#FF6B6B
          STATUS=Muzik Dinliyor
          TOTAL_SHARDS=auto
          SHARD_LIST=auto
          SHARD_MODE=process
          SHARD_RESPAWN=true
          SHARD_SPAWN_DELAY=5500
          SHARD_SPAWN_TIMEOUT=30000
          EOF
      - name: Botu calistir
        working-directory: ./MusicBot-main
        run: node index.js
