name: Ajan Bot
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-ajan-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ajan-botu
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Start Bot
        env:
          AJAN_TOKEN: ${{ secrets.AJAN_TOKEN }}
        run: node index.js
