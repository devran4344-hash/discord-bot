name: ReelsCord Auto Video Fetcher

on:
  schedule:
    # Her 6 saatte bir calisir (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch-videos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reelscord

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Paketleri Yukle
        run: npm install

      - name: Videolari Otomatik Cek ve Firebase'e Ekle
        run: node scripts/auto-fetch.js
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}